if(k=="qi"){show('<p class="meta">Part 2</p><h2>'+N+' questions only you can answer</h2><p class="lead">Short answers are fine. Each question has an example, and many ask for the US and Pakistan separately. You can skip any question and come back to it.</p><p class="hint">Use Save progress at the top any time to get a link that restores your answers and your place.</p>',0,BK+NX("Begin"));return}
if(k=="q"){var n=s.n,q=Q[n],a=ans(n);h='<p class="meta">'+(n+1)+' / '+N+' · '+q[0]+'</p><h2>'+q[1]+'</h2>';
if(q[2])h+='<p class="ex">'+q[2]+'</p>';
if(q[4]){h+='<div class="opts">';q[4].forEach(function(o,x){var p=a.s.indexOf(o);h+='<button class="opt'+(p>-1?" on":"")+'" onclick="pick('+x+')"><b>'+(q[5]>1&&p>-1?p+1:"✓")+'</b>'+o+'</button>'});h+='</div>';if(q[5]>1)h+='<p class="hint">'+a.s.length+' of '+q[5]+' selected</p>'}
q[3].forEach(function(l,x){if(q[4])l="Add detail (optional)";h+=(l?'<label for="f'+x+'">'+l+'</label>':"")+'<textarea id="f'+x+'" data-k="'+x+'" placeholder="Type your answer">'+esc(a.t[x]||"")+'</textarea>'});
show(h,0,BK+'<button class="lnk" onclick="go(i+1)">Skip</button>'+NX());return}
if(k=="ov"){h='<p class="meta">Part 3</p><h2>Six phases, one decision at each</h2><p class="lead">You approve every phase before the next one starts. This is a draft timeline of about 10 to 12 weeks, adjusted once scope is agreed.</p><div class="rows">';PH.forEach(function(p,x){h+=row("0"+(x+1),p[0],p[2],p[1])});show(h+'</div>',0,BK+NX("Phase by phase"));return}
if(k=="p"){var p=s.p;show('<p class="meta">How we work · '+p[1]+'</p><div class="big">0'+(s.n+1)+'</div><h2>'+p[0]+'</h2><p class="lead">'+p[2]+'</p><div class="bl"><b>You get</b><span>'+p[3]+'</span></div><div class="bl"><b>We need from you</b><span>'+p[4]+'</span></div>',0,BK+NX(s.n==PH.length-1?"Review and submit":"Next"));return}

function pick(x){grab();var n=cur().n,q=Q[n],a=ans(n),o=q[4][x],p=a.s.indexOf(o);if(p>-1)a.s.splice(p,1);else{if(q[5]==1)a.s=[];if(a.s.length>=q[5])a.s.shift();a.s.push(o)}save();render()}
function txt(){var o="ToltHawk Brand Discovery\n"+(S.who?"From: "+S.who+"\n":"")+"\n";Q.forEach(function(q,x){o+=(x+1)+". "+q[1]+"\n"+(ansText(x)||"(skipped)")+"\n\n"});return o}

function cpy(){var e=$("ul");if(navigator.clipboard)navigator.clipboard.writeText(e.value).then(function(){toast("Link copied")},function(){e.select()});else e.select()}

function sendC(){var t=$("ct").value.trim(),n=$("cn").value.trim();if(!t)return;if(n){S.who=n;persist()}post({type:"comment",id:S.id,who:S.who,screen:sid(),label:slabel(),text:t}).then(function(j){if(j.error)throw 0;$("ct").value="";loadC()}).catch(function(){toast("Could not send. Try again.")})}
document.addEventListener("keydown",function(e){if(e.key=="Escape"){closeM();$("pn").classList.remove("open")}if(e.key=="Enter"&&(e.ctrlKey||e.metaKey)&&cur().k=="q")go(i+1)});
