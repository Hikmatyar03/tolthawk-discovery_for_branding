<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · ToltHawk discovery</title><meta name="robots" content="noindex"><link rel="icon" href="logo.png">
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#0a0a0a;background:#f6f7fc}header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#fff;border-bottom:1px solid #e3e6ee}header img{height:24px}header span{flex:1}
main{max-width:900px;margin:0 auto;padding:20px}button{font:inherit;border-radius:999px;border:1px solid #4364ef;background:#4364ef;color:#fff;padding:8px 18px;cursor:pointer}button.g{background:#fff;color:#0a0a0a;border-color:#e3e6ee}
input,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid #e3e6ee;border-radius:10px}.c{background:#fff;border:1px solid #e3e6ee;border-radius:12px;padding:16px;margin:0 0 14px}.c h3{margin:0 0 4px}.m{color:#5b6170;font-size:13px}.q{border-top:1px solid #e3e6ee;padding:8px 0;white-space:pre-wrap}.q b{display:block}.ok{color:#2f9e5b}.d{border-left:3px solid #4364ef;padding-left:10px;margin:8px 0}.t{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}</style></head><body>
<header><img src="logo.png" alt="KreaitX"><span>ToltHawk discovery · admin</span><button class="g" onclick="load()">Refresh</button></header><main id="m"></main>
<script>
var K=sessionStorage.getItem("k")||"",D=null,tab="r";
function e(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(){if(!K){ask();return}fetch("/api/data?admin=1",{headers:{"x-admin-key":K}}).then(function(r){if(r.status==401){sessionStorage.removeItem("k");K="";ask("Wrong key");throw 0}return r.json()}).then(function(j){if(j.error){document.getElementById("m").innerHTML="<p>"+e(j.error)+"</p>";return}D=j;draw()}).catch(function(){})}
function ask(msg){document.getElementById("m").innerHTML='<div class="c"><h3>Admin key</h3><p class="m">'+(msg||"Enter the ADMIN_KEY you set in Vercel.")+'</p><input id="k" type="password"><p><button onclick="K=document.getElementById(\'k\').value;sessionStorage.setItem(\'k\',K);load()">Open</button></p></div>'}
function txt(){var o="";D.responses.forEach(function(r){o+="== "+(r.who||"Unnamed")+" ("+(r.submitted?"submitted "+r.submitted:"in progress")+") ==\n";r.answers.forEach(function(a){if(a.a)o+=a.n+". "+a.q+"\n"+a.a+"\n\n"})});o+="\n== COMMENTS ==\n";D.comments.forEach(function(c){o+="["+c.label+"] "+(c.role=="designer"?"KreaitX":c.who||"Client")+": "+c.text+"\n"});return o}
function dlf(n,t,y){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:y}));a.download=n;a.click()}
function draw(){var h='<div class="t"><button class="'+(tab=="r"?"":"g")+'" onclick="tab=\'r\';draw()">Responses ('+D.responses.length+')</button><button class="'+(tab=="c"?"":"g")+'" onclick="tab=\'c\';draw()">Comments ('+D.comments.length+')</button><button class="g" onclick="dlf(\'tolthawk-discovery.json\',JSON.stringify(D,null,2),\'application/json\')">Download JSON</button><button class="g" onclick="dlf(\'tolthawk-discovery.txt\',txt(),\'text/plain\')">Download text</button></div>';
if(tab=="r"){D.responses.sort(function(a,b){return b.updated>a.updated?1:-1}).forEach(function(r){var n=r.answers.filter(function(a){return a.a}).length;h+='<details class="c"><summary><b>'+e(r.who||"Unnamed")+'</b> <span class="m">· '+n+' of '+r.answers.length+' answered · updated '+new Date(r.updated).toLocaleString()+'</span> '+(r.submitted?'<b class="ok">Submitted</b>':'<span class="m">In progress</span>')+'</summary>';r.answers.forEach(function(a){if(a.a)h+='<div class="q"><b>'+a.n+'. '+e(a.q)+'</b>'+e(a.a)+'</div>'});h+='</details>'});if(!D.responses.length)h+='<p class="m">No responses yet.</p>'}
else{var g={},o=[];D.comments.forEach(function(c){if(!g[c.screen]){g[c.screen]=[];o.push(c.screen)}g[c.screen].push(c)});o.forEach(function(s){var L=g[s];h+='<div class="c"><h3>'+e(L[0].label)+'</h3>';L.forEach(function(c){h+='<div class="'+(c.role=="designer"?"d":"q")+'"><b>'+e(c.role=="designer"?"KreaitX":c.who||"Client")+' <span class="m">'+new Date(c.ts).toLocaleString()+'</span></b>'+e(c.text)+'</div>'});h+='<textarea id="r_'+s+'" rows="2" placeholder="Reply as KreaitX"></textarea><p><button onclick="rep(\''+s+'\',\''+e(L[0].label).replace(/\'/g,"")+'\')">Reply</button></p></div>'});if(!o.length)h+='<p class="m">No comments yet.</p>'}
document.getElementById("m").innerHTML=h}
function rep(s,l){var t=document.getElementById("r_"+s).value.trim();if(!t)return;fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":K},body:JSON.stringify({type:"comment",id:"admin",who:"KreaitX",screen:s,label:l,text:t})}).then(load)}
load();
</script></body></html>
